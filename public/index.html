<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b7a3b" />
    <title>Saathi — Gig Worker Companion</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <span class="logo" aria-hidden="true">👷</span>
        <strong>Saathi</strong>
        <span class="tagline" data-i18n="tagline">AI working for the worker</span>
      </div>
      <button
        id="profile-chip"
        class="profile-chip"
        type="button"
        aria-label="Edit profile"
        hidden
      ></button>
    </header>

    <nav class="tabs" role="tablist" aria-label="Saathi features">
      <button role="tab" class="tab" data-mode="home" aria-selected="true" id="tab-home">
        <span class="tab-icon" aria-hidden="true">🏠</span>
        <span class="tab-label" data-i18n="tabs.home">Home</span>
      </button>
      <button role="tab" class="tab" data-mode="earnings" aria-selected="false" id="tab-earnings">
        <span class="tab-icon" aria-hidden="true">💰</span>
        <span class="tab-label" data-i18n="tabs.earnings">Earnings</span>
      </button>
      <button role="tab" class="tab" data-mode="safety" aria-selected="false" id="tab-safety">
        <span class="tab-icon" aria-hidden="true">🛟</span>
        <span class="tab-label" data-i18n="tabs.safety">Safety</span>
      </button>
      <button role="tab" class="tab" data-mode="schemes" aria-selected="false" id="tab-schemes">
        <span class="tab-icon" aria-hidden="true">🪪</span>
        <span class="tab-label" data-i18n="tabs.schemes">Schemes</span>
      </button>
      <button role="tab" class="tab" data-mode="document" aria-selected="false" id="tab-document">
        <span class="tab-icon" aria-hidden="true">📄</span>
        <span class="tab-label" data-i18n="tabs.document">Docs</span>
      </button>
      <button role="tab" class="tab" data-mode="grievance" aria-selected="false" id="tab-grievance">
        <span class="tab-icon" aria-hidden="true">✉️</span>
        <span class="tab-label" data-i18n="tabs.grievance">Grievance</span>
      </button>
    </nav>

    <main id="panel" role="tabpanel" aria-live="polite" aria-busy="false"></main>

    <dialog id="onboarding" aria-labelledby="onboarding-title">
      <form method="dialog" id="onboarding-form">
        <h2 id="onboarding-title">Saathi</h2>
        <p data-i18n="onboarding.intro">Set up your profile. Takes 30 seconds.</p>

        <label>
          <span data-i18n="profile.name">Name</span>
          <input name="name" required maxlength="80" autocomplete="name" />
        </label>

        <label>
          <span data-i18n="profile.workType">Work type</span>
          <select name="workType" required></select>
        </label>

        <label>
          <span data-i18n="profile.platform">Platform / employer</span>
          <select name="platform" required></select>
        </label>

        <div class="row">
          <label>
            <span data-i18n="profile.city">City</span>
            <input name="city" required maxlength="80" />
          </label>
          <label>
            <span data-i18n="profile.state">State</span>
            <input name="state" required maxlength="80" />
          </label>
        </div>

        <label>
          <span data-i18n="profile.language">Language</span>
          <select name="language" required></select>
        </label>

        <div class="actions">
          <button type="submit" class="primary" data-i18n="onboarding.save">Save and start</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
